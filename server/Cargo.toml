[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
sea-orm = { version = "2.0.4", features = [ "sqlx-mysql", "runtime-tokio-native-tls", "macros", "with-time" ] }
serde = "1.0.229"
serde_json = "1.0.154"
chrono = "0.4.45"
rand = "0.9"
tower-http = { version = "0.6", features = ["cors"] }
